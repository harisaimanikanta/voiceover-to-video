<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Caption; src: url(/fonts/caption.otf); font-weight: 800; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #c, #o { position: absolute; left: 0; top: 0; display: block; }
</style>
<script src="/node_modules/topojson-client/dist/topojson-client.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "kit": "/kit/kit.js"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="o"></canvas>
<script type="module">
  import * as THREE from 'three';
  const q = new URLSearchParams(location.search);
  const width = +q.get('w'), height = +q.get('h');
  const canvas = document.getElementById('c'), overlay = document.getElementById('o');
  for (const el of [canvas, overlay]) { el.width = width; el.height = height; el.style.width = width + 'px'; el.style.height = height + 'px'; }
  const ctx = overlay.getContext('2d');
  try {
    await document.fonts.load('800 40px Caption').catch(() => {});
    const mod = await import('/scene/' + q.get('scene'));
    const scene = await mod.setup({ THREE, canvas, width, height });
    const captions = mod.captions || [];      // [{t0, t1, text}]
    const style = Object.assign({ size: 0.062, y: 0.66, color: '#ffffff', stroke: '#000000', font: 'Caption, Inter, sans-serif' }, mod.captionStyle || {});
    const titles = mod.titles || [];         // [{t0, t1, text, sub?, color?}] key-fact titles (top of frame)
    window.__warn = []; window.warn = m => window.__warn.push(m);
    window.__duration = mod.duration;
    window.__fps = mod.fps;
    window.renderFrame = async (t) => {
      await scene.render(t);
      ctx.clearRect(0, 0, width, height);
      const ti = titles.find(c => t >= c.t0 && t < c.t1);
      if (ti) {   // pop in, hold, fade out
        const a = Math.min(1, (t - ti.t0) / 0.15, (ti.t1 - t) / 0.2), s = 0.8 + 0.2 * Math.min(1, (t - ti.t0) / 0.15);
        const px = Math.round((ti.size || 0.085) * width), y = height * (ti.y || 0.14);
        ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.translate(width / 2, y); ctx.scale(s, s);
        ctx.font = `800 ${px}px ${style.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const w = ctx.measureText(ti.text).width + px * 0.9, h = px * 1.35;
        ctx.fillStyle = ti.color || '#e8613c'; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h * 0.28); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.fillText(ti.text, 0, px * 0.04);
        if (ti.sub) { const sp = Math.round(Math.max(px * 0.5, width * 0.036)); ctx.font = `700 ${sp}px ${style.font}`; ctx.lineWidth = sp * 0.22; ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.lineJoin = 'round';
          ctx.strokeText(ti.sub, 0, h / 2 + sp * 0.95); ctx.fillText(ti.sub, 0, h / 2 + sp * 0.95); }
        ctx.restore();
      }
      const cap = captions.find(c => t >= c.t0 && t < c.t1);
      if (cap && !style.off) {
        const px = Math.round(style.size * width);
        ctx.font = `800 ${px}px ${style.font}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = px * 0.16; ctx.strokeStyle = style.stroke;
        // pop-in: scale up during the first 80 ms of each caption
        const k = Math.min(1, (t - cap.t0) / 0.08), s = 0.85 + 0.15 * k;
        ctx.save(); ctx.translate(width / 2, height * style.y); ctx.scale(s, s);
        ctx.strokeText(cap.text, 0, 0); ctx.fillStyle = style.color; ctx.fillText(cap.text, 0, 0);
        ctx.restore();
      }
    };
    window.__ready = true;
  } catch (e) {
    window.__error = String(e && e.stack || e);
  }
</script>
</body>
</html>
